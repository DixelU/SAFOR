name: SAFOR

on:
  push:
    branches:
      - master
      - develop
      - develop-*
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build-linux:
    name: build-gcc
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build 64 bit executable
        run: g++-14 SAFOR.cpp -o SAFOR64 -mavx -Ofast -std=c++23 -I"." -static -lstdc++exp -s
      - uses: actions/upload-artifact@v4
        name: Artifact Upload
        with:
          name: SAFOR For Linux
          path: SAFOR64

  build-windows:
    name: build-mingw
    runs-on: 'windows-2025'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      #- name: Setup tmate session
      #  uses: mxschmitt/action-tmate@v3
      #  with:
      #    detached: true
      - name: Build 32 bit resource
        run: windres.exe --input SAFOR32.rc --output SAFOR32.res --output-format=coff --target pe-i386
      - name: Build 64 bit resource
        run: windres.exe --input SAFOR64.rc --output SAFOR64.res --output-format=coff --target pe-x86-64
      - name: Build 64 bit executable
        run: g++ SAFOR.cpp -o SAFOR64.exe SAFOR64.res -msse2 -Ofast -m64 -std=c++23 -I"." -static -lgdi32 -lcomdlg32 -luuid -luxtheme -lcomctl32 -lstdc++exp -s
      - name: Build 32 bit executable
        shell: bash
        run: PATH=/c/mingw32/bin /c/mingw32/bin/g++.exe SAFOR.cpp -o SAFOR32.exe SAFOR32.res -msse2 -Ofast -m32 -std=c++23 -I"." -static -lgdi32 -lcomdlg32 -luuid -luxtheme -lcomctl32 -lstdc++exp -s
      - name: Upload preps
        run: |
          dir
          mkdir prebuilt
          move SAFOR64.exe prebuilt/SAFOR64.exe
          move SAFOR32.exe prebuilt/SAFOR32.exe

      - uses: actions/upload-artifact@v4
        name: Upload Artifact
        with:
          name: SAFOR For Windows
          path: prebuilt
